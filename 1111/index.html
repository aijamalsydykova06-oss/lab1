<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Космос жана Планеталар</title>
  <!-- CSS шилтемеси -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Фондук жылдыздар -->
  <div class="stars-bg"></div>

  <!-- 4. НЕГИЗГИ ТАЛАПТАР -->
  <section>
    <h1>Күн системасынын планеталары</h1>
    <div class="cards-container">
      
      <!-- 1-карточка (Марс) -->
      <div class="planet-card">
        <div class="planet-visual mars"></div>
        <h3>Марс</h3>
        <p>Кызыл планета, Күндөн төртүнчү аралыкта жайгашкан.</p>
      </div>

      <!-- 2-карточка (Юпитер) -->
      <div class="planet-card">
        <div class="planet-visual jupiter"></div>
        <h3>Юпитер</h3>
        <p>Күн системасындагы эң чоң планета.</p>
      </div>

      <!-- 3-карточка (Жер) -->
      <div class="planet-card">
        <div class="planet-visual earth"></div>
        <h3>Жер</h3>
        <p>Биздин үйүбүз, жашоо бар жалгыз белгилүү планета.</p>
      </div>

      <!-- 4-карточка (Нептун) -->
      <div class="planet-card">
        <div class="planet-visual neptune"></div>
        <h3>Нептун</h3>
        <p>Күндөн эң алыс жайгашкан муздуу дүйнө.</p>
      </div>

    </div>
  </section>

  <!-- 5. КОШУМЧА ТАПШЫРМА: Живая Солнечная система -->
  <section>
    <h2>«Живая Солнечная система»</h2>
    <div class="solar-system">
      <!-- Желтое Солнце -->
      <div class="sun"></div>
      
      <!-- 1-орбита -->
      <div class="orbit orbit-1">
        <div class="orbit-planet p1"></div>
      </div>
      
      <!-- 2-орбита -->
      <div class="orbit orbit-2">
        <div class="orbit-planet p2"></div>
      </div>
    </div>
  </section>

</body>
</html>
